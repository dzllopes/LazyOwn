name: lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dev deps
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format check (maintained packages; legacy tree tracked in CLAUDE.md s16b)
        run: ruff format --check core cli tests/test_core.py tests/test_cli_command_sets.py tests/test_cli_assign.py
      - name: check command_index.json
        run: python scripts/build_command_index.py --check
      - name: check doc stats
        run: python scripts/sync_doc_stats.py --check

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dev deps
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: mypy (core + cli)
        run: mypy --config-file pyproject.toml --no-site-packages core cli setup.py
