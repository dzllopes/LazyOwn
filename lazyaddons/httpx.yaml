name: httpx
description: >
  HTTP probing with ProjectDiscovery httpx. Reports which hosts answer over
  HTTP or HTTPS together with status code, page title and detected
  technologies.
  Usage:
    assign domain example.com
    httpx
    httpx -l sessions/subfinder_example.com.txt
  Extra arguments are appended to the command line.
  Output is written to sessions/httpx_<domain>.txt.
  The binary is invoked as httpx-toolkit because the LazyOwn virtualenv
  ships the unrelated Python httpx client under the plain httpx name.
  MITRE: T1595.002 Vulnerability Scanning.
author: ProjectDiscovery
version: '1.12.0'
enabled: true
os: network
trigger:
  - http
  - https
params:
  - name: domain
    type: string
    required: true
    description: Host or domain to probe, read from payload.json.
tool:
  name: httpx
  install_command: go install github.com/projectdiscovery/httpx/cmd/httpx@latest && ln -s "$(go env GOPATH)/bin/httpx" /usr/local/bin/httpx-toolkit
  execute_command: >
    httpx-toolkit -silent -status-code -title -tech-detect
    -u {domain}
    -o sessions/httpx_{domain}.txt
category: 02. Scanning & Enumeration
